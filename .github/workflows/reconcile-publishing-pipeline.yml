name: Reconcile publishing pipeline

on:
  schedule:
    # Weekdays 10:00–12:45 JST (01:00–03:45 UTC) every 15 min
    - cron: '0,15,30,45 1-3 * * 1-5'
    # Weekday 13:00 JST (04:00 UTC)
    - cron: '0 4 * * 1-5'
  workflow_dispatch:
    inputs:
      force_slug:
        description: 'Optional: focus one slug'
        required: false
        default: ''
      now:
        description: 'Optional: simulate now (full ISO8601 JST offset)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: insights-publishing-git
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sync with origin before reconcile
        run: git pull --ff-only origin "${GITHUB_REF_NAME:-main}"

      - name: Wait for the authoritative publish instant
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.now != ''
        env:
          NOW: ${{ github.event.inputs.now }}
        run: node scripts/wait-for-publish-time.mjs "$NOW"

      - name: Reconcile publication state
        id: publish
        env:
          FORCE_SLUG: ${{ github.event.inputs.force_slug }}
          NOW: ${{ github.event.inputs.now }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_CHANNEL_ID_LINKEDIN: ${{ secrets.BUFFER_CHANNEL_ID_LINKEDIN }}
          BUFFER_CHANNEL_ID_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_ID_FACEBOOK }}
          BUFFER_CHANNEL_ID_TWITTER: ${{ secrets.BUFFER_CHANNEL_ID_TWITTER }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
        run: |
          set -euo pipefail
          if [ -n "${NOW:-}" ] && [[ ! "${NOW}" =~ T ]]; then
            echo "NOW must be full ISO8601 (e.g. 2026-08-13T10:30:00+09:00)"
            exit 1
          fi
          CMD=(node scripts/reconcile-publishing-pipeline.mjs --skip-verify --skip-buffer)
          if [ "${DRY_RUN_INPUT:-false}" = "true" ]; then CMD+=(--dry-run); fi
          if [ -n "${FORCE_SLUG:-}" ]; then CMD+=(--force-slug "$FORCE_SLUG"); fi
          if [ -n "${NOW:-}" ]; then CMD+=(--now "$NOW"); fi
          set +e
          "${CMD[@]}" | tee /tmp/reconcile-publish.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e
          if grep -q 'UPDATED=1' /tmp/reconcile-publish.log; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          SLUG="$(
            grep '^ACTIVE_SLUG=' /tmp/reconcile-publish.log \
              | tail -1 \
              | cut -d= -f2- \
              || true
          )"
          echo "slug=${SLUG}" >> "$GITHUB_OUTPUT"
          echo "exit_code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"

      - name: Commit and push authoritative Web state
        if: steps.publish.outputs.changed == 'true'
        env:
          FORCE_SLUG: ${{ github.event.inputs.force_slug }}
          NOW: ${{ github.event.inputs.now }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          chmod +x scripts/lib/gha-git-push.sh
          branch="${GITHUB_REF_NAME:-main}"
          commit_and_push() {
            scripts/lib/gha-git-push.sh \
              "$(cat <<'EOF'
          Reconcile Insights publication state

          Persist publish attempt and Web source before production verification.
          EOF
          )" \
              insights/ sitemap.xml llms.txt insights/_scheduled/ insights/_social/ reports/
          }
          # Exit 42 means origin changed a file this checkout also edited
          # (the 7a575ac overwrite). Discard the stale tree and recompute.
          recompute_from_origin() {
            git fetch origin "$branch"
            git reset --hard "origin/${branch}"
            git clean -fd
            CMD=(node scripts/reconcile-publishing-pipeline.mjs --skip-verify --skip-buffer)
            if [ "${DRY_RUN_INPUT:-false}" = "true" ]; then CMD+=(--dry-run); fi
            if [ -n "${FORCE_SLUG:-}" ]; then CMD+=(--force-slug "$FORCE_SLUG"); fi
            if [ -n "${NOW:-}" ]; then CMD+=(--now "$NOW"); fi
            "${CMD[@]}" | tee /tmp/reconcile-publish-retry.log
            if ! grep -q 'UPDATED=1' /tmp/reconcile-publish-retry.log; then
              echo "Recompute produced no publication changes"
              exit 0
            fi
          }
          set +e
          commit_and_push
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          if [ "$code" -ne 42 ]; then
            exit "$code"
          fi
          for attempt in 2 3 4 5; do
            echo "origin moved under files this run edited — recomputing from latest ${branch} (attempt ${attempt})"
            recompute_from_origin
            set +e
            commit_and_push
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              exit 0
            fi
            if [ "$code" -ne 42 ]; then
              exit "$code"
            fi
          done
          echo "Could not publish without overwriting newer commits on ${branch}" >&2
          exit 1

      - name: Stop after persisted publication failure
        if: steps.publish.outputs.exit_code != '0'
        run: exit 1

      - name: Verify production and resume Buffer handoff
        id: delivery
        # Delivery is a reconciliation concern, not a child of today's
        # publication. A later run must discover any verified pending
        # handoff after a delayed Hero recovery.
        if: steps.publish.outputs.exit_code == '0'
        env:
          NOW: ${{ github.event.inputs.now }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          BUFFER_CHANNEL_ID_LINKEDIN: ${{ secrets.BUFFER_CHANNEL_ID_LINKEDIN }}
          BUFFER_CHANNEL_ID_FACEBOOK: ${{ secrets.BUFFER_CHANNEL_ID_FACEBOOK }}
          BUFFER_CHANNEL_ID_TWITTER: ${{ secrets.BUFFER_CHANNEL_ID_TWITTER }}
          BUFFER_ORGANIZATION_ID: ${{ secrets.BUFFER_ORGANIZATION_ID }}
        run: |
          set -euo pipefail
          CMD=(node scripts/reconcile-publishing-pipeline.mjs --skip-publish)
          if [ "${DRY_RUN_INPUT:-false}" = "true" ]; then CMD+=(--dry-run); fi
          if [ -n "${NOW:-}" ]; then CMD+=(--now "$NOW"); fi
          "${CMD[@]}" | tee /tmp/reconcile-delivery.log
          if grep -q 'UPDATED=1' /tmp/reconcile-delivery.log; then echo "changed=true" >> "$GITHUB_OUTPUT"; else echo "changed=false" >> "$GITHUB_OUTPUT"; fi
          if grep -q 'BUFFER_DELIVERY_COMPLETE=TRUE' /tmp/reconcile-delivery.log; then echo "buffer_complete=true" >> "$GITHUB_OUTPUT"; else echo "buffer_complete=false" >> "$GITHUB_OUTPUT"; fi

      - name: Commit and push verified delivery state
        if: steps.delivery.outputs.changed == 'true'
        run: |
          set -euo pipefail
          chmod +x scripts/lib/gha-git-push.sh
          scripts/lib/gha-git-push.sh \
            "Verify Insight production and reconcile Buffer handoff" \
            insights/_scheduled/schedule.json insights/_social/ reports/

      - name: Fail incomplete Buffer delivery after persisting channel state
        if: steps.delivery.outputs.changed == 'true' && steps.delivery.outputs.buffer_complete == 'false'
        run: exit 1

      - name: Post-deploy IndexNow
        if: steps.publish.outputs.exit_code == '0'
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          DRY_RUN_INPUT: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "${DRY_RUN_INPUT:-false}" = "true" ]; then
            echo "IndexNow: skipped dry run"
            exit 0
          fi
          PUBLISHED="$(grep '^PUBLISHED_SLUGS=' /tmp/reconcile-publish.log | tail -1 | cut -d= -f2- || true)"
          FRESHNESS="$(grep '^FRESHNESS_SLUGS=' /tmp/reconcile-publish.log | tail -1 | cut -d= -f2- || true)"
          SLUGS="$(printf '%s,%s' "${PUBLISHED}" "${FRESHNESS}" | sed 's/^,//; s/,$//; s/,,*/,/g')"
          if [ -z "${SLUGS}" ]; then
            echo "IndexNow: no published or freshness URLs"
            exit 0
          fi
          node scripts/submit-indexnow-post-deploy.mjs --slugs "${SLUGS}"
